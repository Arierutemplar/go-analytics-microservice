server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Los assets de Vite llevan hash en el nombre: cacheables a largo plazo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
